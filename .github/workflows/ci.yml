name: CI

# Quand lancer le workflow : à chaque push sur main, et à chaque pull request vers main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Une machine Linux neuve, fournie par GitHub (Docker y est déjà installé)
    runs-on: ubuntu-latest

    # Indique à OpenSSL où trouver le certificat de développement pour une machine linux
    env:
      SSL_CERT_DIR: /home/runner/.aspnet/dev-certs/trust:/usr/lib/ssl/certs

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Créer le certificat HTTPS de développement
        run: dotnet dev-certs https --trust

      - name: Restaurer les dépendances
        run: dotnet restore
        working-directory: src

      - name: Compiler
        run: dotnet build --no-restore --configuration Release
        working-directory: src

      - name: Lancer les tests
        run: dotnet test --no-build --configuration Release
        working-directory: src